    font-weight: 400; font-size: clamp(48px, 9vw, 120px); color: #f4eeff;
    text-shadow: 0 0 12px rgba(190,170,255,.8), 0 0 40px rgba(130,110,255,.55);
    /* handwriting: a soft-edged mask sweeps left to right, pausing between the two words */
    -webkit-mask-image: linear-gradient(100deg, #000 33.5%, transparent 37%); mask-image: linear-gradient(100deg, #000 33.5%, transparent 37%);
    -webkit-mask-size: 300% 100%; mask-size: 300% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    animation: write 5s cubic-bezier(.4,0,.3,1) 1s both; }
  @keyframes write {
    from { -webkit-mask-position: 58% 0; mask-position: 58% 0; }
    42%  { -webkit-mask-position: 31% 0; mask-position: 31% 0; }
    52%  { -webkit-mask-position: 29% 0; mask-position: 29% 0; }
    to   { -webkit-mask-position: 0 0;    mask-position: 0 0; } }
  #hint { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; pointer-events: none;
    font: 13px/1 system-ui, sans-serif; letter-spacing: .08em; color: #fff; opacity: .7;
    text-shadow: 0 1px 4px rgba(0,0,0,.4); transition: opacity 2s; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<h1 id="title">Good Night</h1>
<div id="hint">click anywhere to replay the bloom</div>
<script>
const cv = document.getElementById('c'), g = cv.getContext('2d'), hint = document.getElementById('hint');
let W, H, D;
function size() { D = Math.min(devicePixelRatio || 1, 2); W = cv.width = innerWidth * D; H = cv.height = innerHeight * D; }
addEventListener('resize', size); size();

// ---------- helpers ----------
const R = (a, b) => a + Math.random() * (b - a);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;   // ease in-out
const eo = t => 1 - Math.pow(1 - t, 3);                                       // ease out
const add = (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k, a[2] + b[2] * k];
const cross = (a, b) => [a[1]*b[2] - a[2]*b[1], a[2]*b[0] - a[0]*b[2], a[0]*b[1] - a[1]*b[0]];
const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const nrm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };
const hex = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
const mix = (a, b, t) => `rgb(${a.map((v, i) => v + (b[i] - v) * t | 0)})`;
const wind = (x, n) => .04 * (Math.sin(n * .9 + x * 3) + .6 * Math.sin(n * 1.7 + x * 7 + 1)) * (1 + .4 * Math.sin(n * .23));

// ---------- lily varieties: throat, base, mid, tip, speckle ----------
const PAL = [
  ['#cfe08a', '#e8e6c0', '#fffdf6', '#ffffff', null],       // white
  ['#e6d46a', '#b8155a', '#ec5d9c', '#fbd7e6', '#7d0a40'],   // stargazer
  ['#d8e060', '#ffcf5a', '#ff8a1f', '#e8530c', '#3d1304'],   // tiger
  ['#d9d85a', '#f2c200', '#ffd23a', '#ffe98c', null],        // yellow
  ['#b04a3a', '#5d0614', '#c8102e', '#e8453c', '#3a0410'],   // red
  ['#e6dc8a', '#ffe6b8', '#ffb59a', '#ff9a80', '#c4472f'],   // peach
  ['#9a7fb0', '#3f0a52', '#8e2f9e', '#cc82e0', '#2a0436'],   // plum
  ['#e0e090', '#ffd3df', '#ffeef2', '#ffffff', '#e0708f'],   // blush
].map(p => p.map(c => c && hex(c)));
const BUD = [120, 170, 70];

// ---------- procedural world ----------
const world = [], lilies = [];
for (let i = 0; i < 26; i++) {
  const y = .64 + .32 * Math.pow(Math.random(), .9), pal = PAL[i % PAL.length], side = Math.random() < .5 ? -1 : 1, rot = R(0, 6.28);
  lilies.push({
    lily: 1, x: .03 + .94 * ((i * .6180339) % 1), y, sc: .45 + .7 * (y - .64) / .32,
    hs: R(.36, .46), lean: R(-.1, .1), curve: R(-.04, .04), pal, hue: R(95, 120), delay: 0,
    face: nrm([side * R(.15, .5), -R(.1, .4), 1]),
    leaves: [0, 1, 2, 3].map(k => ({ s: .1 + k * .13 + R(0, .04), side: k % 2 ? 1 : -1, len: R(.2, .3), ang: R(.45, .85) })),
    tep: [0, 1, 2, 3, 4, 5].map(k => {
      const inner = k % 2;
      return { inner, az: k * Math.PI / 3 + rot + R(-.06, .06), L: inner ? R(.86, .92) : R(.98, 1.02),
        W: inner ? R(.23, .27) : R(.16, .19), seed: R(0, 6),
        sp: pal[4] ? Array.from({ length: 16 }, () => ({ u: R(.1, .55), v: R(-.75, .75), r: R(.012, .024) })) : [] };
    }),
    st: [0, 1, 2, 3, 4, 5].map(k => ({ az: k * Math.PI / 3 + rot + .5 + R(-.2, .2), len: R(.56, .68), spread: R(.35, .7) })),
  });
}
world.push(...lilies);
for (let i = 0; i < 1400; i++) {            // grass blades, depth-sorted together with the lilies
  const y = .6 + .4 * Math.pow(Math.random(), .8), d = (y - .6) / .4;
  world.push({ x: R(-.02, 1.02), y, h: R(.025, .07) * (.5 + .9 * d), w: R(1, 2.2) * (.6 + d), lean: R(-.04, .04), ph: R(0, 6.28),
    col: `hsl(${R(72, 100)},${R(35, 55)}%,${R(18, 30) + d * 14}%)` });
}
world.sort((a, b) => a.y - b.y);

const stars = Array.from({ length: 260 }, () => ({ x: R(0, 1), y: Math.pow(Math.random(), 1.2) * .58, r: R(.5, 1.6), ph: R(0, 6.28), sp: R(.8, 2.6),
  col: ['255,255,255', '255,240,210', '200,220,255'][Math.random() * 3 | 0] }));
const pollen = Array.from({ length: 70 }, () => ({ x: R(0, 1), y: R(.25, 1), vx: R(.004, .014), r: R(.8, 2.2), ph: R(0, 6.28) }));

// ---------- drawing ----------
function ribbon(pts, wf) {                  // tapered 2D strip along a polyline
  const L = [], Rr = [], n = pts.length - 1;
  for (let i = 0; i <= n; i++) {
    const a = pts[Math.max(i - 1, 0)], b = pts[Math.min(i + 1, n)], dx = b[0] - a[0], dy = b[1] - a[1], m = Math.hypot(dx, dy) || 1;
    const nx = -dy / m, ny = dx / m, w = wf(i / n);
    L.push([pts[i][0] + nx * w, pts[i][1] + ny * w]); Rr.push([pts[i][0] - nx * w, pts[i][1] - ny * w]);
  }
  const p = new Path2D(); p.moveTo(L[0][0], L[0][1]);
  for (const q of L) p.lineTo(q[0], q[1]);
  for (let i = n; i >= 0; i--) p.lineTo(Rr[i][0], Rr[i][1]);
  p.closePath(); return p;
}

// One tepal as a 3D ribbon: direction swings from "hugging the axis" (bud) to flat + recurved tip (open).
function tepal(l, p, o, curl, A, U, V, P, L) {
  const N = 14, c = Math.cos(p.az), s = Math.sin(p.az);
  const Rd = [U[0]*c + V[0]*s, U[1]*c + V[1]*s, U[2]*c + V[2]*s];
  const Sd = [-U[0]*s + V[0]*c, -U[1]*s + V[1]*c, -U[2]*s + V[2]*c];
  const len = L * p.L, open0 = p.inner ? 1 : 1.12, tipc = p.inner ? .75 : 1, cup = lerp(.9, .25, o), ws = lerp(.9, 1, o);
  const wf = u => p.W * len * ws * Math.pow(Math.sin(Math.PI * Math.pow(u, .75)), .85) * (1 + (p.inner ? .07 : 0) * Math.sin(u * 16 + p.seed)) + .02 * len * (1 - u);
  let pos = [0, 0, 0]; const mids = [], ds = [];
  for (let i = 0; i <= N; i++) {
    const u = i / N, e = lerp(.3 - .55 * u, open0 + .95 * tipc * curl * u * u, o);
    const d = [A[0]*Math.cos(e) + Rd[0]*Math.sin(e), A[1]*Math.cos(e) + Rd[1]*Math.sin(e), A[2]*Math.cos(e) + Rd[2]*Math.sin(e)];
    mids.push(pos); ds.push(d); pos = add(pos, d, len / N);
  }
  const norm = i => { let n = cross(ds[i], Sd); return dot(n, A) < 0 ? [-n[0], -n[1], -n[2]] : n; };
  const sx = q => P[0] + q[0], sy = q => P[1] + q[1];
  const path = new Path2D(), Rt = [];
  for (let i = 0; i <= N; i++) {
    const w = wf(i / N), n = norm(i), k = w * cup * .4;
    const l1 = [mids[i][0] - Sd[0]*w + n[0]*k, mids[i][1] - Sd[1]*w + n[1]*k];
    const r1 = [mids[i][0] + Sd[0]*w + n[0]*k, mids[i][1] + Sd[1]*w + n[1]*k];
    i ? path.lineTo(P[0] + l1[0], P[1] + l1[1]) : path.moveTo(P[0] + l1[0], P[1] + l1[1]);
    Rt.push([P[0] + r1[0], P[1] + r1[1]]);
  }
  for (let i = N; i >= 0; i--) path.lineTo(Rt[i][0], Rt[i][1]);
  path.closePath();
  const pal = l.pal, gb = (1 - o) * (p.inner ? .4 : .85);
  const gr = g.createLinearGradient(sx(mids[0]), sy(mids[0]), sx(mids[N]), sy(mids[N]));
  gr.addColorStop(0, mix(pal[0], BUD, gb * .5)); gr.addColorStop(.15, mix(pal[1], BUD, gb));
  gr.addColorStop(.5, mix(pal[2], BUD, gb)); gr.addColorStop(1, mix(pal[3], BUD, gb * .8));
  const nm = nrm(norm(N >> 1)), sh = Math.abs(dot(nm, nrm([.5, -.55, .65])));
  return {
    z: mids[N >> 1][2] + (p.inner ? .05 * len : 0),
    draw() {
      g.fillStyle = gr; g.fill(path);
      g.fillStyle = `rgba(40,10,20,${.3 * (1 - sh)})`; g.fill(path);                 // facing-away shading
      g.strokeStyle = 'rgba(0,0,0,.10)'; g.lineWidth = D; g.beginPath();           // midrib
      for (let i = 1; i < N - 1; i++) g.lineTo(sx(mids[i]), sy(mids[i]));
      g.stroke();
      if (pal[4] && o > .2) {                                                         // throat speckles
        g.fillStyle = `rgba(${pal[4]},${.8 * o})`; g.beginPath();
        for (const sp of p.sp) {
          const i = Math.round(sp.u * N), w = wf(sp.u) * sp.v, x = sx(mids[i]) + Sd[0] * w, y = sy(mids[i]) + Sd[1] * w;
          g.moveTo(x + sp.r * len, y); g.arc(x, y, sp.r * len, 0, 6.3);
        }
        g.fill();
      }
      g.strokeStyle = 'rgba(60,30,20,.22)'; g.lineWidth = .8 * D; g.stroke(path);
    }
  };
}

function stamen(az, len, spread, sa, A, U, V, P, L, pistil) {
  const c = Math.cos(az), s = Math.sin(az), Rd = [U[0]*c + V[0]*s, U[1]*c + V[1]*s, U[2]*c + V[2]*s];
  let pos = [0, 0, 0]; const pts = [];
  for (let i = 0; i <= 6; i++) {
    const e = .1 + spread * (i / 6) * (pistil ? .4 : 1);
    pts.push(pos); pos = add(pos, [A[0]*Math.cos(e) + Rd[0]*Math.sin(e), A[1]*Math.cos(e) + Rd[1]*Math.sin(e), A[2]*Math.cos(e) + Rd[2]*Math.sin(e)], L * len / 6);
  }
  const sp = pts.map(q => [P[0] + q[0], P[1] + q[1]]), tip = sp[6], pr = sp[5];
  return {
    z: pts[6][2],
    draw() {
      g.globalAlpha = sa; g.lineCap = 'round';
      g.strokeStyle = pistil ? '#dfe9b0' : '#f1efcf'; g.lineWidth = Math.max(D, L * (pistil ? .022 : .014));
      g.beginPath(); sp.forEach(q => g.lineTo(q[0], q[1])); g.stroke();
      if (pistil) { g.fillStyle = '#d7e6a0'; g.beginPath(); g.arc(tip[0], tip[1], L * .035, 0, 6.3); g.fill(); }
      else {
        const dx = tip[0] - pr[0], dy = tip[1] - pr[1], m = Math.hypot(dx, dy) || 1, a = [tip[0] - dx / m * L * .11, tip[1] - dy / m * L * .11];
        g.strokeStyle = '#7a3006'; g.lineWidth = L * .055; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(tip[0], tip[1]); g.stroke();
        g.strokeStyle = '#e8801e'; g.lineWidth = L * .032; g.stroke();
      }
      g.globalAlpha = 1;
    }
  };
}

function flower(l, P, tan, t, w, Hs) {
  const oO = eio(cl((t - .22) / .7)), oI = eio(cl((t - .38) / .62)), curl = eo(cl((t - .5) / .5)), fc = eio(cl((t - .12) / .65));
  const L = .26 * Hs * (.42 + .58 * eo(cl(t / .85)));                              // bud swells, then opens
  const up = nrm([tan[0], tan[1], .12]), f = l.face;
  const A = nrm([lerp(up[0], f[0], fc) + w * 2, lerp(up[1], f[1], fc), lerp(up[2], f[2], fc)]);   // bud points up, bloom turns to viewer
  const U = nrm(cross(A, [1, 0, 0])), V = cross(A, U), items = [];
  for (const p of l.tep) items.push(tepal(l, p, p.inner ? oI : oO, curl, A, U, V, P, L));
  const sa = cl((oI - .25) / .3);
  if (sa > 0) {
    for (const s of l.st) items.push(stamen(s.az, s.len, s.spread, sa, A, U, V, P, L, false));
    items.push(stamen(l.tep[0].az + .3, .78, .5, sa, A, U, V, P, L, true));
  }
  items.sort((a, b) => a.z - b.z).forEach(i => i.draw());
}

function drawLily(l, now, t0) {
  const t = cl((now - t0 - l.delay) / 3.6), bx = l.x * W, by = l.y * H, Hs = l.hs * H * l.sc, w = wind(l.x, now), pts = [];
  for (let i = 0; i <= 16; i++) {
    const s = i / 16, q = s * s;
    pts.push([bx + (l.lean * q + w * q * 1.3 + l.curve * Math.sin(s * Math.PI)) * Hs, by - Hs * s * (1 - .05 * Math.abs(l.lean * 3 + w * 6) * s)]);
  }
  const top = pts[16], hh = l.hue;
  const sg = g.createLinearGradient(0, by, 0, top[1]); sg.addColorStop(0, '#2f5527'); sg.addColorStop(1, '#78b050');
  g.fillStyle = sg; g.fill(ribbon(pts, s => (2.2 - .8 * s) * D * l.sc));
  for (const lf of l.leaves) {                                                       // lance-shaped leaves
    const a = pts[Math.round(lf.s * 16)], Ll = lf.len * Hs, lp = [], th0 = lf.ang * lf.side;
    let x = a[0], y = a[1];
    for (let i = 0; i <= 10; i++) {
      const u = i / 10, th = th0 + lf.side * 1.2 * Math.pow(u, 1.4) + w * 3 * u;
      lp.push([x, y]); x += Math.sin(th) * Ll / 10; y -= Math.cos(th) * Ll / 10;
    }
    const lg = g.createLinearGradient(a[0], a[1], x, y); lg.addColorStop(0, `hsl(${hh},45%,18%)`); lg.addColorStop(1, `hsl(${hh},50%,40%)`);
    g.fillStyle = lg; g.fill(ribbon(lp, u => Ll * .075 * Math.pow(Math.sin(Math.PI * Math.pow(u, .7)), .9)));
    g.strokeStyle = 'rgba(230,255,180,.2)'; g.lineWidth = D; g.beginPath(); lp.forEach(q => g.lineTo(q[0], q[1])); g.stroke();
  }
  const p2 = pts[14], tx = top[0] - p2[0], ty = top[1] - p2[1], m = Math.hypot(tx, ty);
  flower(l, top, [tx / m, ty / m], t, w, Hs);
}

function drawBlade(b, now) {
  const x = b.x * W, y = b.y * H, h = b.h * H, bw = b.w * D;
  const tx = x + (b.lean + wind(b.x, now) * 1.8 + .02 * Math.sin(now * 1.3 + b.ph)) * h;
  g.fillStyle = b.col; g.beginPath(); g.moveTo(x - bw, y);
  g.quadraticCurveTo(x + (tx - x) * .35 - bw * .6, y - h * .6, tx, y - h);
  g.quadraticCurveTo(x + (tx - x) * .35 + bw * .6, y - h * .6, x + bw, y); g.fill();
}

function drawSky(now) {
  const sg = g.createLinearGradient(0, 0, 0, H * .62);                              // starry night sky
  [[0, '#02030d'], [.45, '#0b1236'], [.8, '#1c2552'], [1, '#353a6c']].forEach(s => sg.addColorStop(s[0], s[1]));
  g.fillStyle = sg; g.fillRect(0, 0, W, H);
  g.save(); g.translate(W * .35, H * .25); g.rotate(-.5); g.scale(1, .12);          // faint milky way
  const mw = g.createRadialGradient(0, 0, 0, 0, 0, W * .6); mw.addColorStop(0, 'rgba(170,190,255,.22)'); mw.addColorStop(1, 'rgba(170,190,255,0)');
  g.fillStyle = mw; g.beginPath(); g.arc(0, 0, W * .6, 0, 6.3); g.fill(); g.restore();
  for (const s of stars) {
    const a = .45 + .55 * Math.sin(now * s.sp + s.ph) ** 2;
    g.fillStyle = `rgba(${s.col},${a})`; g.beginPath(); g.arc(s.x * W, s.y * H, s.r * D, 0, 6.3); g.fill();
  }
  const mx = W * .8, my = H * .2, mr = H * .05, mg = g.createRadialGradient(mx, my, mr * .8, mx, my, mr * 9);
  mg.addColorStop(0, 'rgba(190,210,255,.35)'); mg.addColorStop(1, 'rgba(190,210,255,0)');
  g.fillStyle = mg; g.fillRect(0, 0, W, H);
  const md = g.createRadialGradient(mx - mr * .3, my - mr * .3, 0, mx, my, mr); md.addColorStop(0, '#fffef4'); md.addColorStop(1, '#d9d8c4');
  g.fillStyle = md; g.beginPath(); g.arc(mx, my, mr, 0, 6.3); g.fill();
  g.fillStyle = 'rgba(120,120,110,.18)';                                              // maria
  [[-.3, -.2, .28], [.25, .1, .22], [-.1, .4, .16], [.35, -.35, .12]].forEach(([dx, dy, r]) => { g.beginPath(); g.arc(mx + dx * mr, my + dy * mr, r * mr, 0, 6.3); g.fill(); });
  [['#1a1f48', .55, .05, 3], ['#10153a', .58, .035, 5]].forEach(([col, base, amp, f]) => {   // dark hills
    g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W; x += 20) g.lineTo(x, H * (base - amp * (.5 + .5 * Math.sin(x / W * f + f) * Math.cos(x / W * f * 2.3))));
    g.lineTo(W, H); g.fill();
  });
  const gg = g.createLinearGradient(0, H * .6, 0, H); gg.addColorStop(0, '#24402f'); gg.addColorStop(1, '#07120d');
  g.fillStyle = gg; g.fillRect(0, H * .6, W, H * .4);
}

function drawPollen(now, dt) {
  g.globalCompositeOperation = 'lighter';
  for (const p of pollen) {
    p.x += (p.vx + wind(p.x, now) * .25) * dt; p.y += Math.sin(now * .7 + p.ph) * .01 * dt - .003 * dt;
    if (p.x > 1.02) p.x = -.02; if (p.y < .2) p.y = 1;
    const a = .35 + .35 * Math.sin(now * 1.5 + p.ph), x = p.x * W, y = p.y * H;
    g.fillStyle = `rgba(255,220,120,${a * .15})`; g.beginPath(); g.arc(x, y, p.r * 4 * D, 0, 6.3); g.fill();
    g.fillStyle = `rgba(255,240,170,${a})`; g.beginPath(); g.arc(x, y, p.r * D, 0, 6.3); g.fill();
  }
  g.globalCompositeOperation = 'source-over';
}

let t0 = null, last = 0;
function replay(now) { t0 = now; lilies.forEach(l => l.delay = R(0, 2.4)); }   // staggered: all done in ~6s
lilies.forEach(l => l.delay = R(0, 2.4));
const title = document.getElementById('title');
addEventListener('pointerdown', () => {
  replay(last); hint.style.opacity = 0;
  title.style.animation = 'none'; title.offsetWidth; title.style.animation = '';   // rewrite the heading too
});

function frame(ms) {
  const now = ms / 1000, dt = Math.min(now - last, .1); last = now;
  if (t0 === null) t0 = now;
  drawSky(now);
  for (const it of world) it.lily ? drawLily(it, now, t0) : drawBlade(it, now);
  g.fillStyle = 'rgba(25,35,90,.28)'; g.fillRect(0, 0, W, H);                        // moonlit blue tint over the garden
  drawPollen(now, dt);
  const wr = g.createRadialGradient(W * .8, H * .2, 0, W * .8, H * .2, W * .9);        // moon glow + vignette
  wr.addColorStop(0, 'rgba(170,200,255,.10)'); wr.addColorStop(1, 'rgba(170,200,255,0)');
  g.fillStyle = wr; g.fillRect(0, 0, W, H);
  const vg = g.createRadialGradient(W / 2, H / 2, H * .5, W / 2, H / 2, W * .75);
  vg.addColorStop(0, 'rgba(10,15,30,0)'); vg.addColorStop(1, 'rgba(10,15,30,.4)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
